# TRUE HR — Nginx reverse proxy for truehr.co.in
# Place at: /etc/nginx/sites-available/truehr.co.in
# Enable:   ln -s /etc/nginx/sites-available/truehr.co.in /etc/nginx/sites-enabled/
# Then run certbot (see DEPLOYMENT.md) to add the HTTPS (443) block automatically.
#
# Layout:
#   /              -> static landing page  (/var/www/truehr-landing/index.html)
#   /app/...       -> Next.js web container (built with basePath /app)
#   /api/...       -> backend container
#   legacy /login, /admin, /ess, ... -> 308 redirect to /app/... (old links/emails)
#
# One-time on the server:
#   sudo mkdir -p /var/www/truehr-landing
#   sudo cp ~/truehr/deploy/landing/index.html /var/www/truehr-landing/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name truehr.co.in www.truehr.co.in;

    # Onboarding uploads (photos, PDFs, signatures) travel as base64 JSON — allow headroom.
    client_max_body_size 25m;

    # API -> backend container (bound to localhost by docker-compose.prod.yml)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The application -> Next.js web container (built with basePath /app)
    location ^~ /app {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy application paths (old bookmarks + already-sent onboarding emails)
    location ~ ^/(login|forgot-password|change-password|admin|ess|onboarding|sso|privacy|terms)(/|$) {
        return 308 /app$request_uri;
    }

    # Landing page (static, served straight from disk)
    root /var/www/truehr-landing;
    location / {
        try_files $uri /index.html;
    }
}
